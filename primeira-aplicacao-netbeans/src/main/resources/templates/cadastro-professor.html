<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de professor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container">
        <h1>Cadastro de professor</h1>

        <a th:href="@{/professores}" class="link-voltar">Voltar para a lista</a>

        <form th:action="@{/professores/salvar}" th:object="${professor}" method="post">

            <input type="hidden" th:field="*{id}">

            <div th:if="${#fields.hasAnyErrors()}" class="resumo-erros">
                <h3>Verifique os campos:</h3>
                <ul>
                    <li th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></li>
                </ul>
            </div>

            <label>Nome:</label>
            <input type="text" th:field="*{nome}"
                   th:classappend="${#fields.hasErrors('nome')} ? 'campo-erro'">
            <span class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>

            <label>E-mail:</label>
            <input type="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'campo-erro'">
            <span class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label>Disciplina:</label>
            <input type="text" th:field="*{disciplina}"
                   th:classappend="${#fields.hasErrors('disciplina')} ? 'campo-erro'">
            <span class="erro" th:if="${#fields.hasErrors('disciplina')}" th:errors="*{disciplina}"></span>

            <label>Titulação:</label>
            <select th:field="*{titulacao}"
                    th:classappend="${#fields.hasErrors('titulacao')} ? 'campo-erro'">
                <option value="">Selecione...</option>
                <option value="Especialista">Especialista</option>
                <option value="Mestre">Mestre</option>
                <option value="Doutor">Doutor</option>
                <option value="Pós-Doutor">Pós-Doutor</option>
            </select>
            <span class="erro" th:if="${#fields.hasErrors('titulacao')}" th:errors="*{titulacao}"></span>

            <button type="submit">Cadastrar</button>
        </form>
    </main>
</body>
</html>
