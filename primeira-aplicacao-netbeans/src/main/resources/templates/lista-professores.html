<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de professores</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">

    <nav class="tabs">
        <a th:href="@{/alunos}">Alunos</a>
        <a th:href="@{/professores}" class="ativo">Professores</a>
    </nav>

    <h1>Professores cadastrados</h1>

    <a th:href="@{/professores/novo}">Novo professor</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Disciplina</th>
                <th>Titulação</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="professor : ${professores}">
                <td th:text="${professor.id}"></td>
                <td th:text="${professor.nome}"></td>
                <td th:text="${professor.email}"></td>
                <td th:text="${professor.disciplina}"></td>
                <td><span class="badge" th:text="${professor.titulacao}"></span></td>
                <td>
                    <a th:href="@{/professores/editar/{id}(id=${professor.id})}">
                        Editar
                    </a>

                    <a href="javascript:void(0)" class="btn-excluir"
                       th:attr="data-url=@{/professores/excluir/{id}(id=${professor.id})}">
                        Excluir
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <div id="modal-excluir" class="modal-fundo">
        <div class="modal-caixa">
            <h3>Excluir professor</h3>
            <p>Tem certeza que deseja excluir este professor? Essa ação não pode ser desfeita.</p>
            <div class="modal-acoes">
                <button type="button" class="btn-cancelar" onclick="fecharModalExclusao()">Cancelar</button>
                <button type="button" class="btn-confirmar-exclusao" onclick="confirmarExclusao()">Excluir</button>
            </div>
        </div>
    </div>

</main>

<script th:inline="none">
    const modalExcluir = document.getElementById('modal-excluir');

    document.querySelectorAll('.btn-excluir').forEach(function (link) {
        link.addEventListener('click', function () {
            modalExcluir.dataset.url = link.dataset.url;
            modalExcluir.classList.add('aberto');
        });
    });

    function fecharModalExclusao() {
        modalExcluir.classList.remove('aberto');
    }

    function confirmarExclusao() {
        window.location.href = modalExcluir.dataset.url;
    }
</script>
</body>
</html>
