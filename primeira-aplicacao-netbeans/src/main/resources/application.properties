spring.application.name=primeira-aplicacao

# Caso a porta 8080 esteja ocupada, descomente a linha abaixo e escolha outra porta
# server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_alunos
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
