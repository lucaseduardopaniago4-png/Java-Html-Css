<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Disciplina</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container">
        <h1 th:text="${disciplina}">Disciplina</h1>
        <div class="box">
            <p>
                <strong>Curso:</strong>
                <span th:text="${curso}">Curso</span>
            </p>
            <p>
                <strong>Semestre:</strong>
                <span th:text="${semestre}">Semestre</span>
            </p>
            <p>
                <strong>Tecnologia:</strong>
                <span th:text="${tecnologia}">Tecnologia</span>
            </p>
        </div>
    </main>
</body>
</html>
